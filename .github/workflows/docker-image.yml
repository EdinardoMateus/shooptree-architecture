name: Docker Build and Test

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait
        run: sleep 15
      - name: Test endpoints
        run: |
          curl -f http://localhost:8001/produtos
          curl -f http://localhost:8002/pagamentos
          curl -f http://localhost:8003/
      - name: Shutdown
        run: docker compose down